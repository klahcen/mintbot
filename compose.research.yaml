# Explicit overlay: docker compose -f compose.yaml -f compose.research.yaml --profile research up
# Existing compose.yaml/server monitoring is unchanged unless this overlay is selected.
services:
  app:
    environment:
      RESEARCH_STATUS_PATH: /app/research-data/${RESEARCH_RUN_NAME:-run}/research-status.json
      MONITOR_PROGRAMS: ""
      REAL_MARKET_PAPER: "false"
      RESEARCH_STOP_PATH: /app/research-control/global-stop.json
    volumes:
      - research-state:/app/research-data:ro
      - research-control:/app/research-control
  research:
    profiles: [research]
    build: .
    init: true
    restart: "no"
    read_only: true
    command: ["node", "dist/scripts/phase11-mainnet.js", "--run", "--seconds", "${RESEARCH_SECONDS:-1800}", "--venues", "${RESEARCH_VENUES:-pump,pumpswap,raydium-cpmm,meteora-dlmm}", "--history-evidence", "/app/history/phase10.json", "--output", "/app/data/${RESEARCH_RUN_NAME:-run}"]
    environment:
      MODE: paper
      REAL_MARKET_PAPER: "false"
      RESEARCH_PROVIDERS_PATH: /app/private/research-providers.json
      RESEARCH_OWNER_PATH: /app/research-control/decision-owner.lock
      RESEARCH_STOP_PATH: /app/research-control/global-stop.json
      RESEARCH_PROGRESS_PATH: /app/data/${RESEARCH_RUN_NAME:-run}/run-progress.json
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      SOLANA_WS_URL: ${SOLANA_WS_URL:-wss://api.mainnet-beta.solana.com}
      SOLANA_SECONDARY_RPC_URL: ${SOLANA_SECONDARY_RPC_URL:-https://solana-rpc.publicnode.com}
      SOLANA_SECONDARY_WS_URL: ${SOLANA_SECONDARY_WS_URL:-wss://solana-rpc.publicnode.com}
    volumes:
      - ./private/research-providers.json:/app/private/research-providers.json:ro
      - research-state:/app/data
      - research-control:/app/research-control
      - ./docs/phase11/coverage-history.json:/app/history/phase10.json:ro
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "node", "-e", "const f=require('fs');try{const e=JSON.parse(f.readFileSync(process.env.RESEARCH_PROGRESS_PATH));process.exit(Date.now()-e.updatedAt<15000&&e.supervisor.liveReady&&!e.pipeline.fatal&&!e.journal.writerFailure&&e.journal.quarantined===0&&e.journal.gaps.every(g=>g.status==='recovered')&&e.coverageEpoch.researchPolicyReview==='verified'?0:1)}catch{process.exit(1)}"]
      interval: 15s
      timeout: 3s
      retries: 2
volumes:
  research-state:
  research-control:
